# Conda environment definition for discord-bot, alice-bot, and insult-runner.
#
# This file replaces requirements.txt as the canonical dependency manifest
# (see memory: feedback_no_pypi_only_conda + reference_anaconda_channel).
#
# Channels (order matters — first match wins):
#   1. bernardurizaorozco — Bernard's personal channel hosts fi-core
#   2. conda-forge        — every other dep
#   3. nodefaults         — explicitly skip Anaconda's `defaults` channel
#                           (commercial license + slower mirror)
#
# Pip subsection: ONLY for packages that have NO conda-forge build for
# Python 3.14 (which is the rule per the memory). As of 2026-05-19 that
# is only `ruff` — ruff==0.11.12 was built for py39/py312/py313 but not
# py314 yet on conda-forge. When the conda feedstock catches up, move
# it back to the conda section.
#
# Local install:
#   conda env create -f environment.yml -n discord-bot
#   conda activate discord-bot
#
# Why Python 3.14: matches the existing runtime (.python-version),
# CI matrix, and the type-hint syntax this codebase already uses.

name: discord-bot
channels:
  - bernardurizaorozco
  - conda-forge
  - nodefaults
dependencies:
  - python=3.14

  # Bernard's shared package — the reason this whole migration exists.
  # fi-core ships the chunking algorithm + Embedder/ChunkStore protocols
  # + DocumentChunkStore (HDF5-backed). HDF5 is the data-pipeline
  # justification for going conda in the first place.
  # Floor raised to 0.7.0 (v4.1.0): the facts layer now uses
  # fi_core.memory.PgMemoryStore, which FIRST shipped in 0.7.0. A build that
  # resolved to 0.5.x/0.6.x (which lack fi_core.memory) would crash facts at
  # import — pin the floor so the conda solver can't cache an older version.
  # Floor raised to 0.9.1 (alice 0.1.20): ALICE's clinical reflection layer
  # imports fi_core.cognitive.PSYCHIATRY (the ClinicalDomain added in 0.9.1);
  # 0.9.0 lacks it and crashes ALICE at boot with ImportError.
  - fi-core>=0.9.1
  # fi-runner — the backend-agnostic runner framework. insult's runner now
  # delegates ClaudeAgentOptions assembly to it (fi_runner.ClaudeCodeBackend).
  # MUST be published to the bernardurizaorozco channel for the prod build.
  # Floor raised to 0.2.1 (alice 0.1.20): CodexBackend._extract_text drops
  # aborted-retry partials (Azure content_filter mid-stream); 0.2.0 concatenates
  # them and garbles ALICE's replies. 0.2.0 also has the azure_endpoint kwargs.
  - fi-runner>=0.2.1

  # Runtime — Discord, LLMs, Postgres, FastAPI
  - discord.py>=2.3.0
  # Python 3.13+ removed the `audioop` stdlib module that discord.py
  # 2.3.x imports unconditionally for voice/audio support.
  # `audioop-lts` is the official backport — installs a module named
  # `audioop` that discord.py's import resolves to. Without this,
  # `import discord` crashes on py314 with ModuleNotFoundError.
  # Drop when discord.py 2.5+ lands on conda-forge (upstream made the
  # import conditional).
  - audioop-lts
  - anthropic>=0.42.0
  - claude-agent-sdk>=0.1.81
  - python-dotenv>=1.0.0
  - pydantic>=2.5.0
  - pydantic-settings>=2.1.0
  - aiosqlite>=0.19.0
  - asyncpg>=0.30.0
  - psycopg>=3.1
  - pgvector-python>=0.4.0
  - structlog>=24.1.0
  - typer>=0.9.0
  - pillow>=10.0.0
  - azure-storage-blob>=12.19.0
  - openai>=1.30.0
  - fastapi>=0.115
  # starlette pinned >=1.0.1: fastapi pulls starlette transitively, and an
  # unpinned resolve grabbed 1.0.0 in CI which carries PYSEC-2026-161 (fix in
  # 1.0.1). This is a web-facing dep (FastAPI runner + debug server), so we
  # patch rather than ignore the advisory. Bump when fastapi's floor moves past it.
  - starlette>=1.0.1
  - uvicorn>=0.30
  - httpx>=0.27
  - sentence-transformers>=3.0.0
  - numpy
  - h5py>=3.10

  # Testing
  - pytest>=8.0.0
  - pytest-asyncio>=0.24.0
  - pytest-cov>=6.0.0
  - pytest-postgresql>=6.0.0

  # Security / lint
  - pip-audit>=2.7.0
  - bandit>=1.8.0

  # Packages without py314 conda-forge build yet → pip fallback (allowed
  # per the memory rule when no conda recipe exists AND we need the
  # exact version). Migrate back to conda section when builds catch up.
  - pip
  - pip:
      # CI pins this version because newer ruff (≥0.13) corrupts some
      # multi-except syntax. Memory: feedback_ruff_version_pinned.
      - ruff==0.11.12
