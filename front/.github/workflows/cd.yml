name: CD

# Builds the image in ACR and rolls the Container App to it. Only on a green CI —
# and CI includes the attack suite, so a revision that could write to the database
# never reaches Azure.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

env:
  RG: insult-rg
  ACR: insultacr
  APP: aire-front

jobs:
  deploy:
    name: Build & deploy
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Azure login
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build the image in ACR
        run: |
          set -euo pipefail
          SHA=$(git rev-parse --short HEAD)
          az acr build -r "$ACR" -t "$APP:$SHA" -t "$APP:latest" .
          echo "SHA=$SHA" >> "$GITHUB_ENV"

      - name: Roll the Container App
        run: |
          set -euo pipefail
          az containerapp update -n "$APP" -g "$RG" \
            --image "$ACR.azurecr.io/$APP:$SHA"

      - name: Verify the new revision actually serves
        run: |
          set -euo pipefail
          FQDN=$(az containerapp show -n "$APP" -g "$RG" \
            --query properties.configuration.ingress.fqdn -o tsv)
          # An internal ingress is not reachable from this runner; say so instead of
          # printing a green tick that means nothing.
          if [ -z "$FQDN" ]; then
            echo "No external ingress — cannot probe from CI. Verify by hand."
            exit 0
          fi
          for i in $(seq 1 12); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' "https://$FQDN/api/health" || true)
            if [ "$CODE" = "200" ]; then
              echo "healthy: https://$FQDN"
              curl -s "https://$FQDN/api/health"
              exit 0
            fi
            sleep 10
          done
          echo "The revision never answered 200 on /api/health."
          exit 1
