name: TheBlowers
options:
  bundleIdPrefix: com.bernard
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

targets:
  TheBlowers:
    type: application
    platform: iOS
    sources:
      - Sources
      - Resources/Assets.xcassets
    configFiles:
      Debug: Config.xcconfig
      Release: Config.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bernard.theblowers
        PRODUCT_NAME: theblowers
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: The Blowers
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: The Blowers
        TheBlowersEmail: $(THEBLOWERS_EMAIL)
        TheBlowersPassword: $(THEBLOWERS_PASSWORD)
        NSCameraUsageDescription: Para tomar y enviar fotos desde el sitio.
        NSPhotoLibraryUsageDescription: Para adjuntar fotos de tu carrete al sitio.
        NSPhotoLibraryAddUsageDescription: Para guardar fotos del sitio en tu carrete.
        NSMicrophoneUsageDescription: Para grabar audio cuando el sitio lo pida.
        NSLocationWhenInUseUsageDescription: Para que el sitio muestre perfiles cerca de ti.
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait

schemes:
  TheBlowers:
    build:
      targets:
        TheBlowers: all
    run:
      config: Debug
