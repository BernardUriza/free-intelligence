name: deploy-server

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - ".github/workflows/deploy-server.yml"
  workflow_dispatch:

concurrency:
  group: deploy-aire-vm
  cancel-in-progress: false

jobs:
  # 71 tests lived in server/tests and CI ran NONE of them — the only gate
  # between a push and the droplet was the thirty-line law, which measures shape,
  # not behaviour. Several of those tests exist precisely because a fix once
  # passed with its mechanism REMOVED (#38); a suite nobody runs cannot catch
  # that. It gates the deploy now: red here means the droplet never sees it.
  test:
    name: The suite that was never run
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bernardurizaorozco
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aire
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      # The same DSN tests/conftest.py falls back to, so the suite runs in CI
      # exactly as it runs on Bernard's Mac — no CI-only code path to drift.
      AIRE_DATABASE_URL: postgresql://bernardurizaorozco:postgres@127.0.0.1:5432/aire
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        working-directory: server
        run: pip install --quiet -r requirements.txt pytest pytest-asyncio
      - name: Thirty-line law check
        working-directory: server
        run: python3 scripts/check_law.py
      - name: pytest
        working-directory: server
        run: python3 -m pytest tests/ -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AIRE_VM_SSH_KEY }}

      - name: Deploy over SSH and verify units are active
        env:
          AIRE_VM_HOST: ${{ secrets.AIRE_VM_HOST }}
        run: |
          set -euo pipefail
          if [[ -z "${AIRE_VM_HOST}" ]]; then
            echo "no host secret yet — skipping deploy"
            exit 0
          fi
          ssh -o StrictHostKeyChecking=accept-new "root@${AIRE_VM_HOST}" bash -s <<'REMOTE'
          set -euo pipefail
          cd /opt/aire
          # The front never rides to the droplet — the body materializes server/ only.
          git sparse-checkout set --cone server 2>/dev/null || true
          git fetch --all
          git reset --hard origin/main
          # A new direct dependency (e.g. httpx for the gateway door) must land
          # with the code that imports it — provisioning is not the only installer.
          /opt/aire/.venv/bin/pip install -q --no-input -r server/requirements.txt
          # The landing's model + its own deps (#32) — one script, shared with
          # provisioning, so the weights never become a hand-placed file.
          bash server/infra/install-nickname.sh
          install -m 644 server/deploy/aire-listener.service \
                         server/deploy/aire-server.service server/deploy/aire-nickname.service \
                         server/deploy/aire-sweep.service server/deploy/aire-sweep.timer \
                         server/deploy/aire-mirror.service server/deploy/aire-mirror.timer \
                         server/deploy/aire-tmpclean.service server/deploy/aire-tmpclean.timer /etc/systemd/system/
          install -m 644 server/deploy/logrotate-aire /etc/logrotate.d/aire
          install -m 644 server/deploy/Caddyfile /etc/caddy/Caddyfile
          systemctl daemon-reload
          systemctl enable --now aire-server aire-nickname >/dev/null 2>&1 || true
          systemctl restart aire-listener aire-server aire-nickname
          systemctl reload caddy || systemctl restart caddy
          systemctl enable --now aire-sweep.timer aire-mirror.timer aire-tmpclean.timer
          sleep 8
          # is-active with multiple units exits 0 if AT LEAST ONE is active —
          # check each unit on its own so a dead one actually breaks the job.
          for u in aire-listener aire-server aire-nickname aire-sweep.timer aire-mirror.timer aire-tmpclean.timer; do
            if ! systemctl --quiet is-active "$u"; then
              echo "$u is NOT active"
              systemctl status "$u" --no-pager || true
              exit 1
            fi
            echo "$u active"
          done
          # The broom is a pillar, not an extra — a bad logrotate config silently
          # stops sweeping the disk the open port lets anyone fill.
          logrotate --debug /etc/logrotate.d/aire >/dev/null
          echo "logrotate config valid"
          REMOTE

      # Everything above measures LIVENESS: a unit is active, a config parses, a
      # port is bound. Not one of them can go red while the engine is dead — the
      # root/bypassPermissions defect killed every agent turn with `is-active`
      # green and /health "ok" (CLAUDE.md), and a dry credential rotor or a lost
      # `claude` binary would read exactly the same. So the deploy's last word is
      # a REAL turn through the public door, from outside the droplet, for $0.03:
      # DNS → TLS → Caddy → Bearer → SDK → Anthropic → an SSE result with text.
      - name: The canary — one real turn through the public door
        env:
          AIRE_PULSE_TOKEN: ${{ secrets.AIRE_PULSE_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${AIRE_PULSE_TOKEN}" ]]; then
            echo "::error::AIRE_PULSE_TOKEN secret is missing — the deploy would ship unverified"
            exit 1
          fi
          bash server/scripts/canary.sh

      # A red canary means the code now on the box does not serve. The rollback is
      # printed, never automatic: the canary also goes red when ANTHROPIC is down,
      # and undoing a good deploy because a vendor blipped is a wrong action taken
      # confidently. The SHA is captured here so the human does not have to dig.
      - name: How to roll back, if the canary went red
        if: failure()
        run: |
          # `github.event.before`, not HEAD~1: actions/checkout is a depth-1
          # clone, so HEAD~1 does not exist here and the rollback hint died with
          # "ambiguous argument" on the one run that needed it.
          PREV="${{ github.event.before }}"
          echo "the box is on ${{ github.sha }} and it did not answer a real turn."
          echo "roll back with:"
          echo "  ssh root@<droplet> 'cd /opt/aire && git reset --hard ${PREV} && systemctl restart aire-server'"
