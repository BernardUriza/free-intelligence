name: deploy-front

# Builds the image on the runner, pushes it to GHCR, and rolls the Container App
# to it. Only on a green "CI front" — and that CI includes the attack suite, so a
# revision that could write to the database never reaches Azure.
#
# The build used to run as `az acr build` against insultacr, which billed twice:
# the ACR task vCPU AND the runner minutes it spent idling on the wait. GHCR
# storage is free and the runner was already paid for.

on:
  workflow_run:
    workflows: [CI front]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  packages: write

env:
  RG: insult-rg
  IMAGE: ghcr.io/bernarduriza/aire-server/front
  APP: aire-front

jobs:
  deploy:
    name: Build & deploy
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Compute the short SHA
        run: echo "SHA=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the image (context = front/)
        uses: docker/build-push-action@v6
        with:
          context: front
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.SHA }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Azure login
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Roll the Container App
        run: |
          set -euo pipefail
          az containerapp update -n "$APP" -g "$RG" \
            --image "$IMAGE:$SHA"

      - name: Verify the new revision actually serves
        run: |
          set -euo pipefail
          FQDN=$(az containerapp show -n "$APP" -g "$RG" \
            --query properties.configuration.ingress.fqdn -o tsv)
          if [ -z "$FQDN" ]; then
            echo "No external ingress — cannot probe from CI. Verify by hand."
            exit 0
          fi
          for i in $(seq 1 12); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' "https://$FQDN/api/health" || true)
            if [ "$CODE" = "200" ]; then
              echo "healthy: https://$FQDN"
              curl -s "https://$FQDN/api/health"
              exit 0
            fi
            sleep 10
          done
          echo "The revision never answered 200 on /api/health."
          exit 1
