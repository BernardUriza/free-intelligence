title: Corpus — valentis (ética del cuidado)
sources:
- title: 'Engaging otherness: care ethics radical perspectives on empathy'
  author: Jolanda van Dijke, Inge van Nistelrooij, Pien Bos, Joachim Duyndam
  year: '2023'
  url: https://pmc.ncbi.nlm.nih.gov/articles/PMC10425473/ (Europe PMC fullTextXML) · DOI 10.1007/s11019-023-10152-0
  license: CC-BY-4.0
  retrieved_at: 2026-09-17
  files:
  - vandijke_2023_care_ethics_empathy.xml
  why: es la ética del cuidado discutiendo su propia herramienta; distingue tres formas de empatía y señala que
