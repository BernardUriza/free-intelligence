# Corpus policy. The runtime reads this file directly (persona_core/corpus/rules.py);
# the modules that use it hold no numbers of their own. Change behavior here.

references:
  # Shortlist the cross-encoder reranks. e5 cosines are compressed (on-topic
  # 0.784-0.888 vs off-topic 0.780-0.834), so they shortlist and never gate.
  # Measured with scripts/corpus_eval.py (60 answerable + 60 off-topic, 24-nov):
  #   cosine 32      56/60 right, 14/60 off-topic accepted
  #   cosine 8       54/60 right,  8/60
  #   fused 16       55/60 right,  7/60   <- tuned on dev, where it ties cosine 32
  #   fused 32       56/60 right, 12/60
  # The case fused 16 loses is "cómo se hace el tempeh" (the page says "tempe").
  candidates: 16
  # Each arm (cosine, BM25) hands its best N to the fusion. 0 = cosine only.
  fusion_pool: 100
  # Passages that may enter one turn.
  top_k: 3
  # Cross-encoder floor. Re-measured 2026-11-24 with scripts/corpus_eval.py:
  #                 right at -2.0  right at -1.2   off-topic accepted (18) at -2.0 / -1.2
  #   alice             12/14          11/14              1 / 0
  #   insult            12/14           9/14              1 / 0
  #   unborn_being      10/14          10/14              1 / 0
  #   vultur            12/12          12/12              3 / 2
  #   valentis           8/8            7/8               0 / 0
  # A higher floor mutes them on the conversational questions they are for.
  min_relevance: -2.0
  # Frugi, tuned on dev (60 + 60): -2.0 is 56/60 right with 9 off-topic, -1.2 is
  # 55/60 with 1. hs-rerank-1 on the same shortlists: 56/60 with 2, not a reason
  # to swap models.
  min_relevance_for:
    __corpus_vegan__: -1.2
  # "ok", "jaja": not worth an embed call.
  min_query_chars: 12
  # Ceiling on the injected block. The best passage always enters, cut at a
  # word if needed: 82 of 893 vegan chunks are over it, and an empty block for
  # the top hit muted Frugi's pregnancy turns on 2026-10-03.
  max_block_chars: 2200
  # How far back a cut looks for a space before giving up on the word boundary.
  truncate_backoff_chars: 80

ingest:
  # Real e5 tokens, not words * 1.3: that estimate let 220 of 2,139 Frugi chunks
  # past the 512-token window (2026-11-24), and e5 drops the overflow in silence.
  chunk_tokens: 400
  overlap_tokens: 50
  min_chunk_tokens: 50
  # e5's window is 512 with the "passage: " prefix and the special tokens inside.
  max_chunk_tokens: 500
  # A whole document under the chunk minimum still enters if it has this many
  # characters: the floor rejects fragments, not short sources (14 contraelamor
  # posts vanished to it on 2026-07-27).
  min_document_chars: 120
  # A sync that would delete more than this share of a namespace is refused.
  max_delete_ratio: 0.10
  # Bump when the extraction or chunking CODE changes: every document re-embeds.
  pipeline: 1

voice:
  # Random draw from the voice pool. Random demos tie or beat similar ones for
  # persona dialogue, and near-duplicates of the ask get copied verbatim
  # (Pu et al. 2024, arXiv 2402.09954), so the closest ones are dropped.
  draw: 12
  drop_most_similar: 3
  top_k: 4
  min_query_chars: 2
