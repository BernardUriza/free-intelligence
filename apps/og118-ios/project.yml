name: OG118
options:
  bundleIdPrefix: com.bernard
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

targets:
  OG118:
    type: application
    platform: iOS
    sources:
      - Sources
      - Resources/Assets.xcassets
    configFiles:
      Debug: Config.xcconfig
      Release: Config.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bernard.og118
        PRODUCT_NAME: og118
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: og118
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Sources/Info.plist
      properties:
        OG118Auth0ClientID: $(OG118_AUTH0_CLIENT_ID)
        NSMicrophoneUsageDescription: og118 usa el micrófono para dictarle tus mensajes.
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: com.bernard.og118
            CFBundleURLSchemes:
              - com.bernard.og118

  OG118UITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    configFiles:
      Debug: Config.xcconfig
      Release: Config.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bernard.og118.uitests
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        TEST_TARGET_NAME: OG118
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: OG118

  OG118UnitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - UnitTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bernard.og118.unittests
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
        # El producto se llama og118 en minúsculas; el TEST_HOST por defecto
        # asume el nombre del target y no lo encuentra.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/og118.app/og118"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: OG118

schemes:
  OG118:
    build:
      targets:
        OG118: all
        OG118UnitTests: [test]
        OG118UITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - OG118UnitTests
        - OG118UITests
