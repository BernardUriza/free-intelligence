name: deploy

on:
  push:
    branches: [main]
    paths:
      - "aire/**"
      - "scripts/**"
      - "demo_device.py"
      - "deploy/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy-aire-vm
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Thirty-line law check
        run: python3 scripts/check_law.py

      - name: Install SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AIRE_VM_SSH_KEY }}

      - name: Deploy over SSH and verify units are active
        env:
          AIRE_VM_HOST: ${{ secrets.AIRE_VM_HOST }}
        run: |
          set -euo pipefail
          if [[ -z "${AIRE_VM_HOST}" ]]; then
            echo "no host secret yet — skipping deploy"
            exit 0
          fi
          ssh -o StrictHostKeyChecking=accept-new "root@${AIRE_VM_HOST}" bash -s <<'REMOTE'
          set -euo pipefail
          cd /opt/aire
          git fetch --all
          git reset --hard origin/main
          install -m 644 deploy/aire-listener.service deploy/aire-device.service \
                         deploy/aire-server.service \
                         deploy/aire-sweep.service deploy/aire-sweep.timer /etc/systemd/system/
          install -m 644 deploy/logrotate-aire /etc/logrotate.d/aire
          systemctl daemon-reload
          systemctl enable --now aire-server >/dev/null 2>&1 || true
          systemctl restart aire-listener aire-server
          systemctl enable --now aire-sweep.timer
          sleep 3
          # is-active with multiple units exits 0 if AT LEAST ONE is active —
          # check each unit on its own so a dead one actually breaks the job.
          for u in aire-listener aire-server aire-sweep.timer; do
            if ! systemctl --quiet is-active "$u"; then
              echo "$u is NOT active"
              systemctl status "$u" --no-pager || true
              exit 1
            fi
            echo "$u active"
          done
          # The broom is a pillar, not an extra — a bad logrotate config silently
          # stops sweeping the disk the open port lets anyone fill.
          logrotate --debug /etc/logrotate.d/aire >/dev/null
          echo "logrotate config valid"
          REMOTE
