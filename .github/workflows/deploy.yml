name: deploy

on:
  push:
    branches: [main]
    paths:
      - "aire/**"
      - "demo_device.py"
      - "deploy/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy-aire-vm
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AIRE_VM_SSH_KEY }}

      - name: Deploy over SSH and verify units are active
        env:
          AIRE_VM_HOST: ${{ secrets.AIRE_VM_HOST }}
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=accept-new "azureuser@${AIRE_VM_HOST}" bash -s <<'REMOTE'
          set -euo pipefail
          cd /opt/aire
          git fetch --all
          git reset --hard origin/main
          sudo systemctl restart aire-listener aire-device
          sleep 1
          systemctl is-active aire-listener aire-device
          REMOTE
