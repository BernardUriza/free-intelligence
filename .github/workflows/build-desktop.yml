name: Build FI Monitor (Windows)

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build (linux, macos, windows, all)'
        required: true
        default: 'all'
        type: choice
        options:
          - linux
          - macos
          - windows
          - all

concurrency:
  group: build-desktop-${{ github.ref }}-${{ github.event.inputs.platform }}
  cancel-in-progress: true

permissions:
  contents: write  # Required for creating releases and tags

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      fi_monitor: ${{ steps.changes.outputs.fi_monitor }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 2  # Need 2 commits to diff

      - name: Detect what changed
        id: changes
        run: |
          # Get changed files in last commit
          CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD || echo "all")

          # Check FI Monitor changes
          if echo "$CHANGED_FILES" | grep -q "apps/fi-monitor/"; then
            echo "fi_monitor=true" >> $GITHUB_OUTPUT
            echo "✅ FI Monitor changed"
          else
            echo "fi_monitor=false" >> $GITHUB_OUTPUT
            echo "⏩ FI Monitor unchanged"
          fi

          # If workflow_dispatch or can't detect changes, build everything
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$CHANGED_FILES" = "all" ]; then
            echo "fi_monitor=true" >> $GITHUB_OUTPUT
            echo "🔄 Manual trigger - building FI Monitor"
          fi

  build-fi-monitor:
    needs: [detect-changes]
    if: |
      (github.event.inputs.platform == 'windows' || github.event.inputs.platform == 'all') &&
      needs.detect-changes.outputs.fi_monitor == 'true'
    runs-on: windows-latest
    continue-on-error: true
    env:
      CARGO_INCREMENTAL: "1"
    steps:
      - name: Checkout main repo
        uses: actions/checkout@v4

      - name: Checkout submodules
        run: |
          git config --global url."https://${{ secrets.GH_PAT }}@github.com/".insteadOf "https://github.com/"
          git submodule update --init --recursive --depth 1

      - name: Setup Tauri build environment
        uses: ./.github/actions/setup-tauri
        with:
          rust-target: x86_64-pc-windows-msvc

      - name: Validate version consistency
        run: pnpm version:check

      - name: Pre-build Validation (Rust)
        if: false  # DISABLED: for faster builds - validation happens during actual build
        working-directory: apps/fi-monitor/src-tauri
        shell: bash
        run: |
          echo "::group::Cargo Check (fast syntax + type validation)"
          cargo check --release
          echo "::endgroup::"

          echo "Note: Skipping cargo fmt and clippy for faster builds"
          echo "Run locally: cargo fmt --check && cargo clippy --all-targets"

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9
        env:
          SCCACHE_GHA_ENABLED: "true"

      - name: Install dependencies
        working-directory: apps/fi-monitor
        run: pnpm install

      - name: Download Ollama and Python Installers
        working-directory: apps/fi-monitor/src-tauri
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path binaries

          # Download Ollama
          $ollamaUrl = "https://ollama.com/download/OllamaSetup.exe"
          $ollamaOutput = "binaries/OllamaSetup.exe"

          Write-Host "Descargando OllamaSetup.exe..."
          Invoke-WebRequest -Uri $ollamaUrl -OutFile $ollamaOutput -UseBasicParsing

          if (-Not (Test-Path $ollamaOutput)) {
            throw "Ollama download failed"
          }

          $ollamaSize = (Get-Item $ollamaOutput).Length / 1MB
          Write-Host "Ollama Downloaded: $([Math]::Round($ollamaSize, 2)) MB"

          if ($ollamaSize -lt 50) {
            throw "Ollama file too small, possibly corrupted"
          }

          $ollamaHash = (Get-FileHash $ollamaOutput -Algorithm SHA256).Hash
          Write-Host "Ollama SHA256: $ollamaHash"

          # Download Python 3.14
          $pythonUrl = "https://www.python.org/ftp/python/3.14.0/python-3.14.0-amd64.exe"
          $pythonOutput = "binaries/python-3.14.0-amd64.exe"

          Write-Host "Descargando python-3.14.0-amd64.exe..."
          Invoke-WebRequest -Uri $pythonUrl -OutFile $pythonOutput -UseBasicParsing

          if (-Not (Test-Path $pythonOutput)) {
            throw "Python download failed"
          }

          $pythonSize = (Get-Item $pythonOutput).Length / 1MB
          Write-Host "Python Downloaded: $([Math]::Round($pythonSize, 2)) MB"

          if ($pythonSize -lt 20) {
            throw "Python file too small, possibly corrupted"
          }

          $pythonHash = (Get-FileHash $pythonOutput -Algorithm SHA256).Hash
          Write-Host "Python SHA256: $pythonHash"

          # Rename files to include target triple (Tauri requirement)
          $target = "x86_64-pc-windows-msvc"
          Move-Item -Path "binaries/OllamaSetup.exe" -Destination "binaries/OllamaSetup-$target.exe" -Force
          Move-Item -Path "binaries/python-3.14.0-amd64.exe" -Destination "binaries/python-3.14.0-amd64-$target.exe" -Force

          Write-Host "✅ Renamed installers with target triple suffix"

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            C:\Users\runneradmin\AppData\Local\pip\Cache
          key: pip-fi-monitor-${{ runner.os }}-py3.14-${{ hashFiles('apps/fi-monitor/pyinstaller/requirements.txt', 'apps/fi-monitor/gateway/requirements.txt', 'apps/fi-monitor/rag_service/requirements.txt') }}
          restore-keys: |
            pip-fi-monitor-${{ runner.os }}-py3.14-
            pip-fi-monitor-${{ runner.os }}-

      - name: Cache PyInstaller build
        uses: actions/cache@v4
        with:
          path: |
            apps/fi-monitor/pyinstaller/dist
            apps/fi-monitor/pyinstaller/build
          key: pyinstaller-fi-monitor-${{ runner.os }}-py3.14-${{ hashFiles('apps/fi-monitor/gateway/**/*.py', 'apps/fi-monitor/rag_service/**/*.py', 'apps/fi-monitor/pyinstaller/*.spec') }}
          restore-keys: |
            pyinstaller-fi-monitor-${{ runner.os }}-py3.14-
            pyinstaller-fi-monitor-${{ runner.os }}-

      - name: Install PyInstaller
        working-directory: apps/fi-monitor/pyinstaller
        run: pip install -r requirements.txt

      - name: Install fi-backend dependencies
        run: |
          pip install -r apps/fi-monitor/gateway/requirements.txt
          pip install -r apps/fi-monitor/rag_service/requirements.txt

      - name: Build fi-backend with PyInstaller
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 15
          max_attempts: 3
          retry_wait_seconds: 30
          command: |
            cd apps/fi-monitor/pyinstaller
            pyinstaller fi-backend.spec
          shell: bash

      - name: Copy fi-backend binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path apps/fi-monitor/src-tauri/binaries
          Copy-Item apps/fi-monitor/pyinstaller/dist/fi-backend-x86_64-pc-windows-msvc.exe `
                    apps/fi-monitor/src-tauri/binaries/fi-backend-x86_64-pc-windows-msvc.exe

      - name: Cache bundled installers (Ollama + Python)
        id: cache-installers
        uses: actions/cache@v4
        with:
          path: |
            apps/fi-monitor/src-tauri/binaries/OllamaSetup-x86_64-pc-windows-msvc.exe
            apps/fi-monitor/src-tauri/binaries/python-3.14.0-amd64-x86_64-pc-windows-msvc.exe
          key: fi-monitor-installers-ollama-latest-python-3.14.0

      - name: Download bundled installers (Ollama + Python)
        if: steps.cache-installers.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $binDir = "apps/fi-monitor/src-tauri/binaries"

          echo "Downloading OllamaSetup..."
          Invoke-WebRequest -Uri "https://ollama.com/download/OllamaSetup.exe" `
            -OutFile "$binDir/OllamaSetup-x86_64-pc-windows-msvc.exe" -UseBasicParsing
          echo "✅ OllamaSetup: $([Math]::Round((Get-Item "$binDir/OllamaSetup-x86_64-pc-windows-msvc.exe").Length / 1MB, 1)) MB"

          echo "Downloading Python 3.14 installer..."
          Invoke-WebRequest -Uri "https://www.python.org/ftp/python/3.14.0/python-3.14.0-amd64.exe" `
            -OutFile "$binDir/python-3.14.0-amd64-x86_64-pc-windows-msvc.exe" -UseBasicParsing
          echo "✅ Python: $([Math]::Round((Get-Item "$binDir/python-3.14.0-amd64-x86_64-pc-windows-msvc.exe").Length / 1MB, 1)) MB"

      - name: Build FI Monitor
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 30
          max_attempts: 3
          retry_wait_seconds: 60
          command: |
            cd apps/fi-monitor
            pnpm tauri build --target x86_64-pc-windows-msvc
          shell: bash

      - name: Smoke Test (Binary Validation)
        working-directory: apps/fi-monitor/src-tauri/target/x86_64-pc-windows-msvc/release
        shell: pwsh
        run: |
          echo "::group::Binary Exists Check"
          if (-Not (Test-Path "fi-monitor.exe")) {
            throw "fi-monitor.exe not found after build"
          }
          echo "✅ Binary exists"
          echo "::endgroup::"

          echo "::group::Binary Size Check"
          $size = (Get-Item "fi-monitor.exe").Length / 1MB
          echo "Binary size: $([Math]::Round($size, 2)) MB"
          if ($size -gt 100) {
            echo "⚠️ Warning: Binary > 100MB (expected 30-50MB)"
          }
          echo "::endgroup::"

      - name: Get artifact paths
        id: paths
        shell: pwsh
        run: |
          $INFO = node apps/fi-monitor/scripts/get-artifact-path.cjs fi-monitor x86_64-pc-windows-msvc nsis | ConvertFrom-Json
          "version=$($INFO.version)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "path=$($INFO.path)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "sig=$($INFO.sig)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "file=$($INFO.file)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Sign NSIS installer
        timeout-minutes: 2
        continue-on-error: true
        working-directory: apps/fi-monitor
        shell: pwsh
        run: |
          pnpm tauri signer sign "${{ steps.paths.outputs.path }}" --private-key "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}"

      - name: Upload NSIS artifact
        uses: actions/upload-artifact@v4
        with:
          name: fi-monitor-windows-nsis
          path: apps/fi-monitor/${{ steps.paths.outputs.path }}

      - name: Upload NSIS signature
        uses: actions/upload-artifact@v4
        with:
          name: fi-monitor-windows-nsis-sig
          path: apps/fi-monitor/${{ steps.paths.outputs.sig }}

      - name: Create GitHub Release
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.paths.outputs.version }}
          name: Release v${{ steps.paths.outputs.version }}
          body: |
            ## FI Monitor v${{ steps.paths.outputs.version }}

            ### Downloads
            - Windows: ${{ steps.paths.outputs.file }}

            ---
            🤖 Auto-generated release
          files: |
            apps/fi-monitor/${{ steps.paths.outputs.path }}
            apps/fi-monitor/${{ steps.paths.outputs.sig }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
