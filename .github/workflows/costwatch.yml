name: costwatch

on:
  schedule:
    - cron: "17 13 * * *"
  workflow_dispatch:

jobs:
  costwatch:
    runs-on: ubuntu-latest
    # Job-level env, NOT `if: secrets.X != ''` on the steps: the `secrets` context
    # is not available in a step's `if`, so such a guard evaluates empty, skips the
    # step, and the watchdog reports green while checking nothing.
    env:
      AIRE_VM_HOST: ${{ secrets.AIRE_VM_HOST }}
    steps:
      - name: Check DigitalOcean spend and inventory against the $20/mo budget
        env:
          DO_TOKEN: ${{ secrets.DO_API_TOKEN }}
          BUDGET_USD: "20"
          WARN_USD: "10"
        run: |
          set -euo pipefail
          if [[ -z "${DO_TOKEN}" ]]; then
            echo "::error::DO_API_TOKEN secret is missing — the watchdog is blind"
            exit 1
          fi
          # --retry: a transient DO API blip must NOT fail the job. A watchdog that
          # cries wolf is a watchdog nobody reads on the day it is right.
          api() {
            curl -sfS --retry 3 --retry-delay 5 --retry-all-errors \
              -H "Authorization: Bearer ${DO_TOKEN}" "https://api.digitalocean.com/v2/$1"
          }

          echo "== spend =="
          USAGE="$(api customers/my/balance | jq -r '.month_to_date_usage')"
          echo "month-to-date usage: \$${USAGE} (warn \$${WARN_USD}, budget \$${BUDGET_USD})"

          echo "== inventory =="
          FAIL=0
          DROPLETS="$(api 'droplets?per_page=200' | jq -r '.droplets[] | "\(.name) \(.size_slug)"')"
          echo "droplets:"; echo "${DROPLETS:-  (none)}"
          if [[ "$DROPLETS" != "aire-droplet s-1vcpu-512mb-10gb" ]]; then
            echo "::error::droplet inventory drifted — expected exactly one aire-droplet s-1vcpu-512mb-10gb"
            FAIL=1
          fi
          for res in volumes snapshots reserved_ips load_balancers databases; do
            N="$(api "$res?per_page=200" | jq -r --arg k "$res" '.[$k] | length')"
            echo "$res: $N"
            if [[ "$N" != "0" ]]; then
              echo "::error::unexpected $res in the account ($N) — nothing besides the droplet is budgeted"
              FAIL=1
            fi
          done
          BACKUPS="$(api 'droplets?per_page=200' | jq -r '.droplets[0].features | index("backups") // "off"')"
          if [[ "$BACKUPS" != "off" ]]; then
            echo "::error::droplet backups are enabled (+20%/mo) — not budgeted"
            FAIL=1
          fi

          echo "== verdict =="
          if awk -v u="$USAGE" -v b="$BUDGET_USD" 'BEGIN{exit !(u+0 >= b+0)}'; then
            echo "::error::month-to-date \$${USAGE} REACHED the \$${BUDGET_USD} budget"
            FAIL=1
          elif awk -v u="$USAGE" -v w="$WARN_USD" 'BEGIN{exit !(u+0 >= w+0)}'; then
            echo "::error::month-to-date \$${USAGE} crossed the \$${WARN_USD} early-warning line"
            FAIL=1
          fi
          [[ "$FAIL" == "0" ]] && echo "OK — spend \$${USAGE}, inventory clean" || exit 1

      # The $20 cap only ever watched DigitalOcean, where spend is frozen at $4. The
      # thing that actually GROWS is the pen's table in Azure Postgres, and port 9099
      # lets anyone on the internet feed it (accepted risk, see the unit's comment).
      # The broom is the only thing holding that back — so the broom gets a watchdog.
      # Checked over SSH, never with a SELECT: this repo is write-only toward the
      # database (.claude/rules/write-only-daemon.md).
      - name: Install SSH key
        if: env.AIRE_VM_HOST != ''
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AIRE_VM_SSH_KEY }}

      - name: Check the broom is sweeping and the disk is not filling
        if: env.AIRE_VM_HOST != ''
        env:
          DISK_PCT_MAX: "80"
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 \
            "root@${AIRE_VM_HOST}" DISK_PCT_MAX="${DISK_PCT_MAX}" bash -s <<'REMOTE'
          set -euo pipefail
          FAIL=0

          DISK_PCT="$(df --output=pcent / | tail -1 | tr -dc '0-9')"
          echo "disk used: ${DISK_PCT}% (max ${DISK_PCT_MAX}%)"
          if (( DISK_PCT >= DISK_PCT_MAX )); then
            echo "::error::droplet disk at ${DISK_PCT}% — the log is filling the box"
            FAIL=1
          fi

          if systemctl --quiet is-active aire-sweep.timer; then
            echo "aire-sweep.timer active"
          else
            echo "::error::aire-sweep.timer is NOT active — nothing is sweeping aire_log"
            FAIL=1
          fi

          # A timer that fires but whose sweep CRASHES every night is a silent
          # non-sweep: check the unit's last exit, not just the timer's liveness.
          # An oneshot that has never run reports Result=success, which is fine —
          # the SWEEP lines below are what prove it actually swept.
          RESULT="$(systemctl show aire-sweep.service -p Result --value)"
          echo "last sweep result: ${RESULT}"
          if [[ "$RESULT" != "success" ]]; then
            echo "::error::last aire-sweep run did not succeed (Result=${RESULT})"
            journalctl -u aire-sweep --no-pager -n 20 || true
            FAIL=1
          fi

          echo "last SWEEP lines:"
          grep SWEEP /opt/aire/aire.log | tail -3 || echo "  (none yet — timer has not fired)"

          # The reader wall. It is the two-halves architecture itself, and until
          # 2026-08-22 it lived only as psql someone typed once — so a restore, a
          # rebuilt server or one dropped role would take the front's eyes out
          # with nothing to notice. Read-only assertion of a GRANT, no view.
          set -a; . /etc/aire/env; set +a
          if /opt/aire/.venv/bin/python3 /opt/aire/server/infra/wall.py --check; then
            :
          else
            echo "::error::the reader wall is down — the front is going blind"
            FAIL=1
          fi

          # How fast the memory is GROWING. do-budget's own words: "never watch
          # only the cloud where the spend is frozen — the blind spot always opens
          # over the thing that grows." DO is frozen at $4 and checked above; the
          # Azure Postgres is the half that grows, and until now only its BROOM
          # was watched, never its size against the input rate.
          if ! /opt/aire/.venv/bin/python3 /opt/aire/server/infra/growth.py; then
            FAIL=1
          fi

          # Which guards are silently OFF (aire/arming.py). Every one of them
          # degrades politely and /health answered "ok" for all of them at once.
          # ONE is DECLARED off, so the alarm does not cry wolf — anything else
          # going dark is the thing this watch exists for:
          #   whitelist_enforce  — deliberate; aire_device is empty, and flipping
          #                        it on with an empty roster denies every device
          #                        (.claude/rules/device-verb-protocol.md).
          #
          # credential_failover LEFT this list on 2026-08-22, the day Bernard armed
          # slot 3 with a metered key. Leaving it declared would have been worse
          # than never declaring it: the guard is ON now, so a future loss of that
          # key must go RED — and a stale declaration would have answered "accepted,
          # carry on" to exactly the regression this watch exists to catch.
          DECLARED='["whitelist_enforce"]'
          # The arming half of /health is gated: the endpoint is the one thing the
          # middleware lets through unauthenticated, and a list of which defences
          # are down is reconnaissance. The token is already in /etc/aire/env.
          DISARMED="$(curl -sS -m 10 -H "Authorization: Bearer ${AIRE_AUTH_TOKEN}" \
                        http://127.0.0.1:8088/health | jq -c '.disarmed // "unreadable"')"
          echo "disarmed guards: ${DISARMED}  (declared: ${DECLARED})"
          UNDECLARED="$(jq -nc --argjson d "$DISARMED" --argjson k "$DECLARED" '$d - $k' 2>/dev/null || echo '"unreadable"')"
          if [[ "$UNDECLARED" != "[]" ]]; then
            echo "::error::undeclared guards are disarmed: ${UNDECLARED} — a safety went off with nobody deciding it"
            FAIL=1
          fi
          exit "$FAIL"
          REMOTE
