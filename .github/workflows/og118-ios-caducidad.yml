name: "og118-ios: caducidad de TestFlight"

# A TestFlight build lives 90 days. Nothing watched the 7-day profile and the app died three
# times; this reads the real expiry every week and renews with three weeks to spare.

on:
  schedule:
    - cron: "17 15 * * 1"
  workflow_dispatch:
    inputs:
      days:
        description: "Renew when fewer than this many days are left"
        default: "21"

permissions:
  actions: write
  issues: write
  contents: read

jobs:
  watch:
    name: "Days left"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Read the newest valid build
        id: read
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          pip install --quiet cryptography
          set +e
          python apps/og118-ios/scripts/testflight_caducidad.py --days "${{ inputs.days || '21' }}" | tee "$RUNNER_TEMP/out.txt"
          echo "code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Renew
        if: steps.read.outputs.code == '3'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run og118-ios-testflight.yml --ref main

      - name: Raise it when the watcher is blind or the renewal did not start
        if: failure() || steps.read.outputs.code == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "og118-ios: el vigilante de TestFlight no pudo renovar" \
            --body "Salida: $(cat "$RUNNER_TEMP/out.txt" 2>/dev/null). Corrida: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          exit 1
