name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Typecheck, lint, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build

  # The read path is only ever "safe" because this passes. It needs the real
  # database — a mocked Postgres cannot tell you whether Postgres refuses a write.
  # Skipped on forks, where the secret is absent, rather than faked green.
  attack:
    name: Prove it cannot write
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run attack
        env:
          AIRE_DATABASE_URL: ${{ secrets.AIRE_DATABASE_URL }}
