name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Conda-native CI per memory feedback_no_pypi_only_conda.
# All jobs install from environment.yml via `setup-micromamba`.
# environment.yml channels: bernardurizaorozco (for fi-core) →
# conda-forge (everything else).
#
# The micromamba action handles caching automatically via cache-environment
# and cache-downloads, keyed on the env file's hash. First run on a new
# environment.yml pays ~3-5 min of resolve+download; subsequent runs hit
# the cache and start in ~30s.

jobs:
  # --- Layer 1: Lint & Format (fastest, runs first) ---
  lint:
    name: Ruff Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up conda env (cached)
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment.yml
          environment-name: discord-bot
          cache-environment: true
          cache-downloads: true
          init-shell: bash

      - name: Ruff lint
        shell: bash -leo pipefail {0}
        run: ruff check --output-format=github .

      - name: Ruff format check
        shell: bash -leo pipefail {0}
        run: ruff format --check .

  # --- Layer 2: Unit Tests + Coverage ---
  test:
    name: Tests + Coverage
    runs-on: ubuntu-latest
    needs: lint
    # `pytest-postgresql` (used by tests/_pg_fixture.py) needs a `pg_ctl` binary
    # at INSULT_PG_CTL so it can spin up an ephemeral PG instance per test
    # session. We install postgresql-17 + pgvector from the official PGDG repo
    # rather than using a service container — pytest-postgresql is a CLIENT of
    # `pg_ctl init`, it does NOT connect to an already-running server. A
    # `services: postgres:` block would be ignored by the fixture.
    steps:
      - uses: actions/checkout@v4

      - name: Set up conda env (cached)
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment.yml
          environment-name: discord-bot
          cache-environment: true
          cache-downloads: true
          init-shell: bash

      - name: Install PostgreSQL 17 + pgvector (system, for pg_ctl)
        # Adds the upstream PGDG apt repo, installs postgresql-17 server bin
        # + the matching pgvector. We stop the auto-started service because
        # `pytest-postgresql` owns the lifecycle of the test instance.
        # NOTE: this is SYSTEM postgres for pg_ctl/server binaries, NOT a
        # conda dep — pytest-postgresql shells out to pg_ctl directly and
        # the conda postgresql package's bins are pathed for activated envs.
        run: |
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          wget --quiet -O - https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo apt-key add -
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-17 postgresql-17-pgvector
          sudo systemctl stop postgresql || true

      - name: Run tests with coverage
        shell: bash -leo pipefail {0}
        env:
          # Tells `tests/_pg_fixture.py` where the postgres-17 pg_ctl lives so
          # the asyncpg-backed tests run against a real PG instead of skipping.
          INSULT_PG_CTL: /usr/lib/postgresql/17/bin/pg_ctl
        run: pytest -v --tb=short --cov --cov-report=term-missing:skip-covered

  # --- Layer 3: Security — Dependency Audit ---
  security-deps:
    name: Dependency Audit (pip-audit)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up conda env (cached)
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment.yml
          environment-name: discord-bot
          cache-environment: true
          cache-downloads: true
          init-shell: bash

      - name: Run pip-audit against the conda env
        shell: bash -leo pipefail {0}
        # pip-audit scans whatever's installed in the active env (conda + pip).
        # CVE-2026-3219 (GHSA-58qw-9mgm-455v): pip <= 26.0.1 treats concatenated
        # tar+ZIP archives as ZIP regardless of filename. MEDIUM (CVSS 4.6).
        # Disclosed 2026-04-20. GitHub Advisory API reports patched_versions=None
        # as of 2026-04-26 — no upstream fix released. Threat model requires pip
        # to install a maliciously-crafted ambiguous archive; CI only installs
        # declared deps from PyPI, so the CVE isn't exploitable here.
        # TODO: revisit 2026-05-15 — drop --ignore-vuln when pip publishes patch.
        #
        # CVE-2026-27205 (flask 2.2.5): pulled in transitively by pip-audit
        # itself for its optional web-UI mode which we do NOT use. flask is
        # never imported by application code; only pip-audit can reach it.
        # Drop when conda-forge ships a pip-audit build that no longer
        # transitively requires flask (or upgrades flask to 3.1.3+).
        run: pip-audit --ignore-vuln CVE-2026-3219 --ignore-vuln CVE-2026-27205

  # --- Layer 4: Security — Static Code Analysis ---
  security-code:
    name: Code Security (bandit)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up conda env (cached)
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment.yml
          environment-name: discord-bot
          cache-environment: true
          cache-downloads: true
          init-shell: bash

      - name: Run bandit
        shell: bash -leo pipefail {0}
        run: bandit -r insult/ -c pyproject.toml
