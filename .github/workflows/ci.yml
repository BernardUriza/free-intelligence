name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Typecheck, lint, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build

  attack:
    name: Prove it cannot write
    runs-on: ubuntu-latest

    # A DISPOSABLE Postgres, not AIRE's. Handing CI the production DSN would widen
    # the blast radius of a credential this repo's whole law is about keeping away
    # from readers — and CI does not need it: it can build the exact same shape.
    #
    # The shape that matters is TWO roles, as in production:
    #   * an owner that writes (the pen — `postgres` here, `aire` there)
    #   * a reader that holds GRANT SELECT and nothing else (the waiter — `aire_reader`)
    # The suite connects as the reader and proves the DATABASE refuses it, which is
    # a stronger claim than proving this repo's code declines to ask.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aire
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      OWNER_DSN: postgresql://postgres:postgres@localhost:5432/aire
      AIRE_DATABASE_URL: postgresql://aire_reader:ci-reader@localhost:5432/aire

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # The daemon owns the DDL (aire-server's law); CI only needs a table shaped
      # like the one it writes, a row the attacks can try to destroy, and the
      # read-only role the app is supposed to arrive as.
      - name: Build the pen, the log, and the waiter's credential
        run: |
          psql "$OWNER_DSN" -v ON_ERROR_STOP=1 <<'SQL'
            CREATE TABLE aire_log (
              seq  bigserial PRIMARY KEY,
              at   timestamptz NOT NULL DEFAULT now(),
              line text NOT NULL
            );
            INSERT INTO aire_log (line) VALUES
              ('2026-01-01T00:00:00 127.0.0.1:1 app-ci KEEPALIVE seq=1'),
              ('2026-01-01T00:00:01 127.0.0.1:1 app-ci MESSAGE POS lat=0 lon=0');

            CREATE ROLE aire_reader LOGIN PASSWORD 'ci-reader';
            GRANT CONNECT ON DATABASE aire TO aire_reader;
            GRANT USAGE ON SCHEMA public TO aire_reader;
            GRANT SELECT ON ALL TABLES IN SCHEMA public TO aire_reader;
          SQL

      # Refuses to run at all unless it arrived as a role that cannot INSERT.
      - run: npm run attack

      # The suite says aire_log is untouched. Verify that from OUTSIDE the code
      # under test — a read path that could write could also lie about it.
      - name: Confirm from outside that nothing was written
        run: |
          ROWS=$(psql "$OWNER_DSN" -tAc "SELECT count(*) FROM aire_log")
          echo "aire_log holds $ROWS rows (expected 2)"
          test "$ROWS" = "2"
