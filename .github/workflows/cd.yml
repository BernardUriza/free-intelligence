name: CD

# Builds and deploys three Azure Container Apps:
#   * discord-bot     — Discord plumbing / gateway. Routes Discord events
#                       to the right runner per turn; does no LLM work
#                       itself once LEGACY_LLM_ENABLED=false. Renamed from
#                       insult-bot on 2026-05-14 (RENAME-1b).
#   * insult-runner   — Claude Code Agent SDK runner (Insult persona).
#                       FastAPI + claude-agent-sdk + OAuth Max.
#   * alice-bot       — ALICE persona runner (Azure OpenAI gpt-4.1).
#                       Passive: only fires on mention or /invite from Insult.
# The ACR image repo `insult-bot` (the OCI artifact name) is retained for
# now since renaming the ACR repo is a separate operation; the Container
# App that consumes it is `discord-bot`. See .claude/rules/architecture.md
# § Nomenclature.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    name: Build & Deploy to Azure
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - uses: actions/checkout@v5

      - name: Azure Login
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build insult-bot image
        run: |
          az acr build \
            --registry insultacr \
            --resource-group insult-rg \
            --image insult-bot:${{ github.sha }} \
            --image insult-bot:latest \
            .

      - name: Build alice-bot image
        # ALICE is a sibling Discord bot (alice/ subpackage). Until this step
        # was added in v3.9.18 her image only got rebuilt by manual
        # `az acr build alice-bot:vX.Y.Z` from Bernard's laptop, which meant
        # every alice/ change required a separate push-then-rebuild ritual.
        # Now she ships with the same SHA as Insult.
        run: |
          az acr build \
            --registry insultacr \
            --resource-group insult-rg \
            --image alice-bot:${{ github.sha }} \
            --image alice-bot:latest \
            --file Dockerfile.alice \
            .

      - name: Build insult-runner image
        # The Agent SDK runner. Lives in its own Container App `insult-runner`
        # inside `insult-env`. Reads the workspace mount populated by the
        # renderer (Postgres -> markdown) and exposes a FastAPI service that
        # Insult calls behind a per-user feature flag (see Fase 2 of the
        # Agent SDK migration plan).
        run: |
          az acr build \
            --registry insultacr \
            --resource-group insult-rg \
            --image insult-runner:${{ github.sha }} \
            --image insult-runner:latest \
            --file infra/azure/runner.Dockerfile \
            .

      - name: Deploy discord-bot
        # The plumbing Container App. ACR image artifact is still named
        # `insult-bot` (legacy); the Container App that consumes it is
        # `discord-bot` (renamed 2026-05-14).
        run: |
          az containerapp update \
            --name discord-bot \
            --resource-group insult-rg \
            --image insultacr.azurecr.io/insult-bot:${{ github.sha }}

      - name: Deploy alice-bot
        run: |
          az containerapp update \
            --name alice-bot \
            --resource-group insult-rg \
            --image insultacr.azurecr.io/alice-bot:${{ github.sha }}

      - name: Deploy insult-runner
        # New revision picks up the latest workspace-files mount + secrets.
        # Continue-on-error in case the runner app doesn't exist yet on the
        # first run that contains this step — the workflow shouldn't break
        # Insult deploys just because the runner isn't set up yet.
        continue-on-error: true
        run: |
          az containerapp update \
            --name insult-runner \
            --resource-group insult-rg \
            --image insultacr.azurecr.io/insult-runner:${{ github.sha }}

      - name: Update consolidator job image
        # The fact-consolidation Container App Job runs from the SAME image
        # as the bot but on a separate cron. Without this step the job stays
        # pinned to whatever SHA was last manually pushed, and any feature
        # that touches the consolidator (siesta marks, prompt changes,
        # schema migrations) silently lags behind the bot.
        run: |
          az containerapp job update \
            --name fact-consolidation \
            --resource-group insult-rg \
            --image insultacr.azurecr.io/insult-bot:${{ github.sha }}

      - name: Verify deployment health
        run: |
          echo "Waiting 30s for new revisions to start..."
          sleep 30

          # --- discord-bot (plumbing) ---
          echo ""
          echo "=== discord-bot ==="
          az containerapp show -n discord-bot -g insult-rg --query "properties.latestRevisionName" -o tsv
          BOT_LOGS=$(az containerapp logs show -n discord-bot -g insult-rg --tail 30 2>&1 || true)
          echo "$BOT_LOGS" | tail -10
          if echo "$BOT_LOGS" | grep -q "bot_ready"; then
            echo "OK discord-bot: bot_ready event present"
          elif echo "$BOT_LOGS" | grep -q "critical\|CRITICAL\|Traceback"; then
            echo "FAIL discord-bot: crash detected on startup"
            echo "$BOT_LOGS" | grep -E "critical|CRITICAL|Traceback|Error" || true
            exit 1
          else
            echo "WARN discord-bot: could not confirm bot_ready, check manually"
          fi

          # --- ALICE ---
          echo ""
          echo "=== alice-bot ==="
          az containerapp show -n alice-bot -g insult-rg --query "properties.latestRevisionName" -o tsv
          ALICE_LOGS=$(az containerapp logs show -n alice-bot -g insult-rg --tail 30 2>&1 || true)
          echo "$ALICE_LOGS" | tail -10
          if echo "$ALICE_LOGS" | grep -q "alice_gateway_ready"; then
            echo "OK alice-bot: gateway_ready event present"
          elif echo "$ALICE_LOGS" | grep -q "critical\|CRITICAL\|Traceback"; then
            echo "FAIL alice-bot: crash detected on startup"
            exit 1
          else
            echo "WARN alice-bot: could not confirm gateway_ready, check manually"
          fi

          # --- Runner (best-effort, doesn't fail the deploy yet) ---
          echo ""
          echo "=== insult-runner ==="
          if az containerapp show -n insult-runner -g insult-rg --query "name" -o tsv 2>/dev/null; then
            az containerapp show -n insult-runner -g insult-rg --query "properties.latestRevisionName" -o tsv
            RUNNER_LOGS=$(az containerapp logs show -n insult-runner -g insult-rg --tail 15 2>&1 || true)
            echo "$RUNNER_LOGS" | tail -10

            # Real smoke test against the deployed runner. This catches the
            # silent-broken-deploy pattern that bit us 2026-05-19: CD reported
            # "success" but the runner was missing publish_html_artifact +
            # deep_memory because an unrelated CI failure had kept the runner
            # on an old sha and nobody noticed for hours. Asserting against
            # the FQDN proves the new image is actually serving.
            FQDN="insult-runner.nicecliff-10074f57.eastus.azurecontainerapps.io"
            TOKEN=$(az containerapp secret show \
              -n insult-runner -g insult-rg \
              --secret-name insult-agent-runner-token \
              --query value -o tsv 2>/dev/null || echo "")

            # 1) /health must report auth_configured=true AND claude_md_present=true.
            HEALTH=$(curl -sS -m 15 "https://$FQDN/health" 2>&1 || echo "{}")
            echo "health: $HEALTH"
            if ! echo "$HEALTH" | grep -q '"auth_configured":true'; then
              echo "FAIL insult-runner: auth_configured!=true in /health"
              exit 1
            fi
            if ! echo "$HEALTH" | grep -q '"claude_md_present":true'; then
              echo "FAIL insult-runner: claude_md_present!=true in /health"
              exit 1
            fi

            # 2) DELETE /v1/session/<random> must return 200 with existed=false.
            # Catches deploys that are stuck on a sha without the v3.9.69
            # session-reset endpoint. Cheap and side-effect-free.
            if [ -n "$TOKEN" ]; then
              RESET=$(curl -sS -m 15 -X DELETE \
                "https://$FQDN/v1/session/cd-smoke-${{ github.run_id }}" \
                -H "Authorization: Bearer $TOKEN" 2>&1 || echo "{}")
              echo "reset: $RESET"
              if ! echo "$RESET" | grep -q '"existed":false'; then
                echo "FAIL insult-runner: DELETE /v1/session returned unexpected shape"
                exit 1
              fi
              echo "OK insult-runner: /health + DELETE /v1/session both green"
            else
              echo "WARN insult-runner: token unavailable, skipping DELETE check"
            fi
          else
            echo "INFO insult-runner: not yet provisioned, skipping health check"
          fi
