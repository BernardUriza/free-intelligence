name: CD

# Builds and deploys the Azure Container Apps + Jobs, but ONLY the surfaces whose
# source actually changed since the SHA each one is currently RUNNING. This is the
# per-service blast-radius cut: a prompt-only change to Insult no longer rebuilds
# ALICE/Vultur or restarts bots that didn't change.
#
# Surfaces and the image each consumes:
#   * discord-bot        <- insult-bot image       (Dockerfile)
#   * fact-consolidation <- insult-bot image       (same image, cron job)
#   * persona-gateway     <- persona-gateway image   (Dockerfile.gateway)
#       (ALICE runs here as a gateway persona since v4.21.110; the legacy
#        alice-bot Container App + Dockerfile.alice were retired 2026-07-05)
#   * persona-runner      <- persona-runner image    (infra/azure/runner.Dockerfile)
#
# Per-image SOURCE deps come from each Dockerfile's COPY lines — the map below is
# COPY-accurate ON PURPOSE: over-building is wasteful, but UNDER-building ships a
# stale surface (the COPY-gap P0 class, 2026-06-16). When a COPY line in any
# Dockerfile changes, update the matching *_PATHS list here in the same commit.
#
# workflow_run cannot use `paths:` (it is decoupled from the push), so change
# detection diffs each image's paths between the SHA the Container App is RUNNING
# and the new SHA. Diffing against the running image (not HEAD~1) is self-healing:
# if a prior deploy was skipped or failed, the diff still spans back to reality.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      force_all:
        description: "Build & deploy every surface regardless of diff"
        type: boolean
        default: false

env:
  NEW_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
  RG: insult-rg
  REGISTRY: insultacr
  ACR: insultacr.azurecr.io

jobs:
  deploy:
    name: Build & Deploy to Azure
    runs-on: ubuntu-latest
    # workflow_run fires on success AND failure; only deploy on a green CI.
    # workflow_dispatch has no workflow_run payload, so allow it through too.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0 # full history so we can diff against any running SHA

      - name: Azure Login
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Detect which surfaces changed
        id: detect
        run: |
          set -euo pipefail
          FORCE="${{ github.event.inputs.force_all || 'false' }}"

          running_tag() {
            # $1=name $2=kind(app|job) -> the :tag of the currently deployed image
            local name="$1" kind="$2" img=""
            if [ "$kind" = "job" ]; then
              img=$(az containerapp job show -n "$name" -g "$RG" \
                --query "properties.template.containers[0].image" -o tsv 2>/dev/null || echo "")
            else
              img=$(az containerapp show -n "$name" -g "$RG" \
                --query "properties.template.containers[0].image" -o tsv 2>/dev/null || echo "")
            fi
            echo "${img##*:}"
          }

          changed() {
            # $1=running_sha ; rest=paths -> "true" if a rebuild is needed.
            # Unknown/absent running SHA (latest, rolled-off, missing app) -> build.
            local running="$1"; shift
            if [ "$FORCE" = "true" ]; then echo "true"; return; fi
            if [ -z "$running" ] || ! git cat-file -e "${running}^{commit}" 2>/dev/null; then
              echo "true"; return
            fi
            if [ -n "$(git diff --name-only "$running" "$NEW_SHA" -- "$@")" ]; then
              echo "true"
            else
              echo "false"
            fi
          }

          GW_SHA=$(running_tag persona-gateway app)
          RUNNER_SHA=$(running_tag persona-runner app)
          HOST_SHA=$(running_tag khimeras-host app)

          BUILD_GW=$(changed "$GW_SHA" \
            environment.yml persona_gateway/ khimeras_shared/ shared/ Dockerfile.gateway)
          # The omnipresent host (#6). Build-ready + dormant: the image ships to ACR
          # so it's there the moment Bernard creates the `khimeras-host` Container App
          # + its HOST_DISCORD_TOKEN. Deploy is continue-on-error, so until that app
          # exists this is a no-op — exactly the gateway's own dormant pattern.
          BUILD_HOST=$(changed "$HOST_SHA" \
            environment.yml demux_ai/ khimeras_shared/ shared/ Dockerfile.host)
          # Gate del castigo LEVANTADO el mismo día (2026-07-14): el "fi-runner
          # importa personas.insult" era un comentario fósil del Dockerfile — el
          # grep del paquete conda instalado dio CERO. Los importadores reales
          # eran persona_runner/{model_routing,router_runtime,mcp_tools}.py, ya
          # repunteados a khimeras_shared.{behavior,deep_memory,html_artifacts}.
          BUILD_RUNNER=$(changed "$RUNNER_SHA" \
            environment.yml shared/ khimeras_shared/ demux_ai/ persona_runner/ \
            persona.md infra/azure/runner.Dockerfile infra/azure/entrypoint.sh)

          {
            echo "build_gw=$BUILD_GW"
            echo "build_runner=$BUILD_RUNNER"
            echo "build_host=$BUILD_HOST"
          } >> "$GITHUB_OUTPUT"

          echo "## CD change detection" >> "$GITHUB_STEP_SUMMARY"
          echo "new sha: \`$NEW_SHA\` (force=$FORCE)" >> "$GITHUB_STEP_SUMMARY"
          echo "| surface | running sha | rebuild |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| persona-gateway | \`${GW_SHA:0:7}\` | $BUILD_GW |" >> "$GITHUB_STEP_SUMMARY"
          echo "| persona-runner | \`${RUNNER_SHA:0:7}\` | $BUILD_RUNNER |" >> "$GITHUB_STEP_SUMMARY"
          echo "| khimeras-host (dormant until provisioned) | \`${HOST_SHA:0:7}\` | $BUILD_HOST |" >> "$GITHUB_STEP_SUMMARY"

      # --- Builds (only what changed) ---

      - name: Build persona-gateway image
        if: ${{ steps.detect.outputs.build_gw == 'true' }}
        run: |
          az acr build --registry "$REGISTRY" --resource-group "$RG" \
            --image persona-gateway:${{ env.NEW_SHA }} --image persona-gateway:latest \
            --file Dockerfile.gateway .

      - name: Build persona-runner image
        if: ${{ steps.detect.outputs.build_runner == 'true' }}
        run: |
          az acr build --registry "$REGISTRY" --resource-group "$RG" \
            --image persona-runner:${{ env.NEW_SHA }} --image persona-runner:latest \
            --file infra/azure/runner.Dockerfile .

      - name: Build khimeras-host image
        if: ${{ steps.detect.outputs.build_host == 'true' }}
        run: |
          az acr build --registry "$REGISTRY" --resource-group "$RG" \
            --image khimeras-host:${{ env.NEW_SHA }} --image khimeras-host:latest \
            --file Dockerfile.host .

      # --- Deploys (only what was rebuilt) ---

      - name: Deploy persona-gateway
        # Continue-on-error so a not-yet-provisioned gateway never breaks the run.
        if: ${{ steps.detect.outputs.build_gw == 'true' }}
        continue-on-error: true
        run: |
          az containerapp update --name persona-gateway --resource-group "$RG" \
            --image "$ACR/persona-gateway:${{ env.NEW_SHA }}"

      - name: Deploy persona-runner
        if: ${{ steps.detect.outputs.build_runner == 'true' }}
        continue-on-error: true
        run: |
          az containerapp update --name persona-runner --resource-group "$RG" \
            --image "$ACR/persona-runner:${{ env.NEW_SHA }}"

      - name: Deploy khimeras-host
        # Dormant until Bernard provisions the `khimeras-host` Container App + its
        # HOST_DISCORD_TOKEN (the cutover atom). continue-on-error so a not-yet-
        # created host never breaks the run — the image is already in ACR, ready.
        if: ${{ steps.detect.outputs.build_host == 'true' }}
        continue-on-error: true
        run: |
          az containerapp update --name khimeras-host --resource-group "$RG" \
            --image "$ACR/khimeras-host:${{ env.NEW_SHA }}"

      - name: Verify persona-gateway health
        if: ${{ steps.detect.outputs.build_gw == 'true' }}
        run: |
          if az containerapp show -n persona-gateway -g "$RG" --query "name" -o tsv 2>/dev/null; then
            az containerapp show -n persona-gateway -g "$RG" --query "properties.latestRevisionName" -o tsv
            GW_LOGS=$(az containerapp logs show -n persona-gateway -g "$RG" --tail 30 2>&1 || true)
            echo "$GW_LOGS" | tail -10
            if echo "$GW_LOGS" | grep -q "persona_gateway_starting"; then
              echo "OK persona-gateway: persona_gateway_starting event present"
            elif echo "$GW_LOGS" | grep -q "critical\|CRITICAL\|Traceback\|persona_gateway_nothing_to_start"; then
              echo "FAIL persona-gateway: crash or no-token on startup"
              exit 1
            else
              echo "WARN persona-gateway: could not confirm startup, check manually"
            fi
          else
            echo "INFO persona-gateway: not yet provisioned, skipping health check"
          fi

      - name: Verify persona-runner health
        if: ${{ steps.detect.outputs.build_runner == 'true' }}
        run: |
          if az containerapp show -n persona-runner -g "$RG" --query "name" -o tsv 2>/dev/null; then
            az containerapp show -n persona-runner -g "$RG" --query "properties.latestRevisionName" -o tsv
            RUNNER_LOGS=$(az containerapp logs show -n persona-runner -g "$RG" --tail 15 2>&1 || true)
            echo "$RUNNER_LOGS" | tail -10

            FQDN="persona-runner.greendune-53f1f4af.eastus2.azurecontainerapps.io"
            TOKEN=$(az containerapp secret show \
              -n persona-runner -g "$RG" \
              --secret-name insult-agent-runner-token \
              --query value -o tsv 2>/dev/null || echo "")

            HEALTH=$(curl -sS -m 15 "https://$FQDN/health" 2>&1 || echo "{}")
            echo "health: $HEALTH"
            if ! echo "$HEALTH" | grep -q '"auth_configured":true'; then
              echo "FAIL persona-runner: auth_configured!=true in /health"
              exit 1
            fi
            if ! echo "$HEALTH" | grep -q '"claude_md_present":true'; then
              echo "FAIL persona-runner: claude_md_present!=true in /health"
              exit 1
            fi

            if [ -n "$TOKEN" ]; then
              RESET=$(curl -sS -m 15 -X DELETE \
                "https://$FQDN/v1/session/cd-smoke-${{ github.run_id }}" \
                -H "Authorization: Bearer $TOKEN" 2>&1 || echo "{}")
              echo "reset: $RESET"
              if ! echo "$RESET" | grep -q '"existed":false'; then
                echo "FAIL persona-runner: DELETE /v1/session returned unexpected shape"
                exit 1
              fi
              echo "OK persona-runner: /health + DELETE /v1/session both green"

              # REAL /v1/turn — the only check that proves the agent loop serves
              # (the ModuleNotFoundError COPY-gap that 502'd 2026-06-16 was invisible
              # to /health and DELETE /v1/session, which never import the persona stack).
              SMOKE_CH="cd-smoke-${{ github.run_id }}"
              TURN_OK=""
              for attempt in 1 2 3 4 5 6; do
                BODY=$(curl -sS -m 120 -w '\nHTTP_CODE:%{http_code}' -X POST \
                  "https://$FQDN/v1/turn" \
                  -H "Authorization: Bearer $TOKEN" \
                  -H "Content-Type: application/json" \
                  -d "{\"channel_id\":\"$SMOKE_CH\",\"user_id\":\"cd-smoke\",\"user_text\":\"ping\"}" 2>&1 \
                  || echo "HTTP_CODE:000")
                CODE=$(echo "$BODY" | grep -o 'HTTP_CODE:[0-9]*' | cut -d: -f2)
                echo "turn attempt $attempt -> HTTP $CODE"
                if echo "$BODY" | grep -qiE "ModuleNotFoundError|No module named"; then
                  echo "FAIL persona-runner: agent loop ModuleNotFoundError — broken image deploy"
                  echo "$BODY" | head -5
                  curl -sS -m 15 -X DELETE "https://$FQDN/v1/session/$SMOKE_CH" \
                    -H "Authorization: Bearer $TOKEN" >/dev/null 2>&1 || true
                  exit 1
                fi
                if [ "$CODE" = "200" ] && echo "$BODY" | grep -q '"text"'; then
                  TURN_OK=1; break
                fi
                sleep 15
              done
              curl -sS -m 15 -X DELETE "https://$FQDN/v1/session/$SMOKE_CH" \
                -H "Authorization: Bearer $TOKEN" >/dev/null 2>&1 || true
              if [ -z "$TURN_OK" ]; then
                echo "FAIL persona-runner: /v1/turn never returned a healthy 200 (agent loop down)"
                exit 1
              fi
              echo "OK persona-runner: real /v1/turn served — agent loop alive"
            else
              echo "WARN persona-runner: token unavailable, skipping DELETE + turn checks"
            fi
          else
            echo "INFO persona-runner: not yet provisioned, skipping health check"
          fi

      - name: Nothing-to-deploy notice
        if: ${{ steps.detect.outputs.build_gw != 'true' && steps.detect.outputs.build_runner != 'true' && steps.detect.outputs.build_host != 'true' }}
        run: echo "No surface changed since its running SHA — nothing built or deployed."
