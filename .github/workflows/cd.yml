name: CD

# Builds and deploys the Azure Container Apps + Jobs, but ONLY the surfaces whose
# source actually changed since the SHA each one is currently RUNNING. This is the
# per-service blast-radius cut: a prompt-only change to Insult no longer rebuilds
# ALICE/Vultur or restarts bots that didn't change.
#
# Surfaces and the image each consumes:
#   * discord-bot        <- insult-bot image       (Dockerfile)
#   * fact-consolidation <- insult-bot image       (same image, cron job)
#   * insult-canary      <- insult-bot image       (same image, cron job)
#   * alice-bot          <- alice-bot image        (Dockerfile.alice)
#   * vultur-gateway     <- vultur-gateway image   (Dockerfile.gateway)
#   * insult-runner      <- insult-runner image    (infra/azure/runner.Dockerfile)
#
# Per-image SOURCE deps come from each Dockerfile's COPY lines — the map below is
# COPY-accurate ON PURPOSE: over-building is wasteful, but UNDER-building ships a
# stale surface (the COPY-gap P0 class, 2026-06-16). When a COPY line in any
# Dockerfile changes, update the matching *_PATHS list here in the same commit.
#
# workflow_run cannot use `paths:` (it is decoupled from the push), so change
# detection diffs each image's paths between the SHA the Container App is RUNNING
# and the new SHA. Diffing against the running image (not HEAD~1) is self-healing:
# if a prior deploy was skipped or failed, the diff still spans back to reality.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      force_all:
        description: "Build & deploy every surface regardless of diff"
        type: boolean
        default: false

env:
  NEW_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
  RG: insult-rg
  REGISTRY: insultacr
  ACR: insultacr.azurecr.io

jobs:
  deploy:
    name: Build & Deploy to Azure
    runs-on: ubuntu-latest
    # workflow_run fires on success AND failure; only deploy on a green CI.
    # workflow_dispatch has no workflow_run payload, so allow it through too.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0 # full history so we can diff against any running SHA

      - name: Azure Login
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Detect which surfaces changed
        id: detect
        run: |
          set -euo pipefail
          FORCE="${{ github.event.inputs.force_all || 'false' }}"

          running_tag() {
            # $1=name $2=kind(app|job) -> the :tag of the currently deployed image
            local name="$1" kind="$2" img=""
            if [ "$kind" = "job" ]; then
              img=$(az containerapp job show -n "$name" -g "$RG" \
                --query "properties.template.containers[0].image" -o tsv 2>/dev/null || echo "")
            else
              img=$(az containerapp show -n "$name" -g "$RG" \
                --query "properties.template.containers[0].image" -o tsv 2>/dev/null || echo "")
            fi
            echo "${img##*:}"
          }

          changed() {
            # $1=running_sha ; rest=paths -> "true" if a rebuild is needed.
            # Unknown/absent running SHA (latest, rolled-off, missing app) -> build.
            local running="$1"; shift
            if [ "$FORCE" = "true" ]; then echo "true"; return; fi
            if [ -z "$running" ] || ! git cat-file -e "${running}^{commit}" 2>/dev/null; then
              echo "true"; return
            fi
            if [ -n "$(git diff --name-only "$running" "$NEW_SHA" -- "$@")" ]; then
              echo "true"
            else
              echo "false"
            fi
          }

          BOT_SHA=$(running_tag discord-bot app)
          ALICE_SHA=$(running_tag alice-bot app)
          GW_SHA=$(running_tag vultur-gateway app)
          RUNNER_SHA=$(running_tag insult-runner app)

          BUILD_BOT=$(changed "$BOT_SHA" \
            environment.yml personas/ shared/ khimeras_shared/ demux_ai/ persona.md \
            scripts/canary_probe.py Dockerfile)
          BUILD_ALICE=$(changed "$ALICE_SHA" \
            environment.yml personas/alice/ shared/ Dockerfile.alice)
          BUILD_GW=$(changed "$GW_SHA" \
            environment.yml persona_gateway/ khimeras_shared/ shared/ Dockerfile.gateway)
          BUILD_RUNNER=$(changed "$RUNNER_SHA" \
            environment.yml shared/ khimeras_shared/ demux_ai/ personas/__init__.py \
            personas/insult/ persona.md infra/azure/runner.Dockerfile infra/azure/entrypoint.sh)

          {
            echo "build_bot=$BUILD_BOT"
            echo "build_alice=$BUILD_ALICE"
            echo "build_gw=$BUILD_GW"
            echo "build_runner=$BUILD_RUNNER"
          } >> "$GITHUB_OUTPUT"

          echo "## CD change detection" >> "$GITHUB_STEP_SUMMARY"
          echo "new sha: \`$NEW_SHA\` (force=$FORCE)" >> "$GITHUB_STEP_SUMMARY"
          echo "| surface | running sha | rebuild |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| insult-bot (discord-bot + jobs) | \`${BOT_SHA:0:7}\` | $BUILD_BOT |" >> "$GITHUB_STEP_SUMMARY"
          echo "| alice-bot | \`${ALICE_SHA:0:7}\` | $BUILD_ALICE |" >> "$GITHUB_STEP_SUMMARY"
          echo "| vultur-gateway | \`${GW_SHA:0:7}\` | $BUILD_GW |" >> "$GITHUB_STEP_SUMMARY"
          echo "| insult-runner | \`${RUNNER_SHA:0:7}\` | $BUILD_RUNNER |" >> "$GITHUB_STEP_SUMMARY"

      # --- Builds (only what changed) ---

      - name: Build insult-bot image
        if: ${{ steps.detect.outputs.build_bot == 'true' }}
        run: |
          az acr build --registry "$REGISTRY" --resource-group "$RG" \
            --image insult-bot:${{ env.NEW_SHA }} --image insult-bot:latest .

      - name: Build alice-bot image
        if: ${{ steps.detect.outputs.build_alice == 'true' }}
        run: |
          az acr build --registry "$REGISTRY" --resource-group "$RG" \
            --image alice-bot:${{ env.NEW_SHA }} --image alice-bot:latest \
            --file Dockerfile.alice .

      - name: Build vultur-gateway image
        if: ${{ steps.detect.outputs.build_gw == 'true' }}
        run: |
          az acr build --registry "$REGISTRY" --resource-group "$RG" \
            --image vultur-gateway:${{ env.NEW_SHA }} --image vultur-gateway:latest \
            --file Dockerfile.gateway .

      - name: Build insult-runner image
        if: ${{ steps.detect.outputs.build_runner == 'true' }}
        run: |
          az acr build --registry "$REGISTRY" --resource-group "$RG" \
            --image insult-runner:${{ env.NEW_SHA }} --image insult-runner:latest \
            --file infra/azure/runner.Dockerfile .

      # --- Deploys (only what was rebuilt) ---

      - name: Deploy discord-bot
        if: ${{ steps.detect.outputs.build_bot == 'true' }}
        run: |
          az containerapp update --name discord-bot --resource-group "$RG" \
            --image "$ACR/insult-bot:${{ env.NEW_SHA }}"

      - name: Update fact-consolidation job image
        # Same image as the bot, separate cron. Sync whenever the bot image rebuilds.
        if: ${{ steps.detect.outputs.build_bot == 'true' }}
        run: |
          az containerapp job update --name fact-consolidation --resource-group "$RG" \
            --image "$ACR/insult-bot:${{ env.NEW_SHA }}"

      - name: Update insult-canary job image (if it exists)
        # Same image as the bot. No-op until the gated job is created by hand.
        if: ${{ steps.detect.outputs.build_bot == 'true' }}
        run: |
          if az containerapp job show --name insult-canary --resource-group "$RG" >/dev/null 2>&1; then
            az containerapp job update --name insult-canary --resource-group "$RG" \
              --image "$ACR/insult-bot:${{ env.NEW_SHA }}"
            echo "canary_job_image_updated sha=${{ env.NEW_SHA }}"
          else
            echo "canary_job_sync_skipped reason=job_not_created_yet"
          fi

      - name: Deploy alice-bot
        if: ${{ steps.detect.outputs.build_alice == 'true' }}
        run: |
          az containerapp update --name alice-bot --resource-group "$RG" \
            --image "$ACR/alice-bot:${{ env.NEW_SHA }}"

      - name: Deploy vultur-gateway
        # Continue-on-error so a not-yet-provisioned gateway never breaks the run.
        if: ${{ steps.detect.outputs.build_gw == 'true' }}
        continue-on-error: true
        run: |
          az containerapp update --name vultur-gateway --resource-group "$RG" \
            --image "$ACR/vultur-gateway:${{ env.NEW_SHA }}"

      - name: Deploy insult-runner
        if: ${{ steps.detect.outputs.build_runner == 'true' }}
        continue-on-error: true
        run: |
          az containerapp update --name insult-runner --resource-group "$RG" \
            --image "$ACR/insult-runner:${{ env.NEW_SHA }}"

      - name: Verify discord-bot health
        if: ${{ steps.detect.outputs.build_bot == 'true' }}
        run: |
          echo "Waiting 30s for the new revision to start..."
          sleep 30
          az containerapp show -n discord-bot -g "$RG" --query "properties.latestRevisionName" -o tsv
          BOT_LOGS=$(az containerapp logs show -n discord-bot -g "$RG" --tail 30 2>&1 || true)
          echo "$BOT_LOGS" | tail -10
          if echo "$BOT_LOGS" | grep -q "bot_ready"; then
            echo "OK discord-bot: bot_ready event present"
          elif echo "$BOT_LOGS" | grep -q "critical\|CRITICAL\|Traceback"; then
            echo "FAIL discord-bot: crash detected on startup"
            echo "$BOT_LOGS" | grep -E "critical|CRITICAL|Traceback|Error" || true
            exit 1
          else
            echo "WARN discord-bot: could not confirm bot_ready, check manually"
          fi

      - name: Verify alice-bot health
        if: ${{ steps.detect.outputs.build_alice == 'true' }}
        run: |
          sleep 15
          az containerapp show -n alice-bot -g "$RG" --query "properties.latestRevisionName" -o tsv
          ALICE_LOGS=$(az containerapp logs show -n alice-bot -g "$RG" --tail 30 2>&1 || true)
          echo "$ALICE_LOGS" | tail -10
          if echo "$ALICE_LOGS" | grep -q "alice_gateway_ready"; then
            echo "OK alice-bot: gateway_ready event present"
          elif echo "$ALICE_LOGS" | grep -q "critical\|CRITICAL\|Traceback"; then
            echo "FAIL alice-bot: crash detected on startup"
            exit 1
          else
            echo "WARN alice-bot: could not confirm gateway_ready, check manually"
          fi

      - name: Verify vultur-gateway health
        if: ${{ steps.detect.outputs.build_gw == 'true' }}
        run: |
          if az containerapp show -n vultur-gateway -g "$RG" --query "name" -o tsv 2>/dev/null; then
            az containerapp show -n vultur-gateway -g "$RG" --query "properties.latestRevisionName" -o tsv
            GW_LOGS=$(az containerapp logs show -n vultur-gateway -g "$RG" --tail 30 2>&1 || true)
            echo "$GW_LOGS" | tail -10
            if echo "$GW_LOGS" | grep -q "persona_gateway_starting"; then
              echo "OK vultur-gateway: persona_gateway_starting event present"
            elif echo "$GW_LOGS" | grep -q "critical\|CRITICAL\|Traceback\|persona_gateway_nothing_to_start"; then
              echo "FAIL vultur-gateway: crash or no-token on startup"
              exit 1
            else
              echo "WARN vultur-gateway: could not confirm startup, check manually"
            fi
          else
            echo "INFO vultur-gateway: not yet provisioned, skipping health check"
          fi

      - name: Verify insult-runner health
        if: ${{ steps.detect.outputs.build_runner == 'true' }}
        run: |
          if az containerapp show -n insult-runner -g "$RG" --query "name" -o tsv 2>/dev/null; then
            az containerapp show -n insult-runner -g "$RG" --query "properties.latestRevisionName" -o tsv
            RUNNER_LOGS=$(az containerapp logs show -n insult-runner -g "$RG" --tail 15 2>&1 || true)
            echo "$RUNNER_LOGS" | tail -10

            FQDN="insult-runner.nicecliff-10074f57.eastus.azurecontainerapps.io"
            TOKEN=$(az containerapp secret show \
              -n insult-runner -g "$RG" \
              --secret-name insult-agent-runner-token \
              --query value -o tsv 2>/dev/null || echo "")

            HEALTH=$(curl -sS -m 15 "https://$FQDN/health" 2>&1 || echo "{}")
            echo "health: $HEALTH"
            if ! echo "$HEALTH" | grep -q '"auth_configured":true'; then
              echo "FAIL insult-runner: auth_configured!=true in /health"
              exit 1
            fi
            if ! echo "$HEALTH" | grep -q '"claude_md_present":true'; then
              echo "FAIL insult-runner: claude_md_present!=true in /health"
              exit 1
            fi

            if [ -n "$TOKEN" ]; then
              RESET=$(curl -sS -m 15 -X DELETE \
                "https://$FQDN/v1/session/cd-smoke-${{ github.run_id }}" \
                -H "Authorization: Bearer $TOKEN" 2>&1 || echo "{}")
              echo "reset: $RESET"
              if ! echo "$RESET" | grep -q '"existed":false'; then
                echo "FAIL insult-runner: DELETE /v1/session returned unexpected shape"
                exit 1
              fi
              echo "OK insult-runner: /health + DELETE /v1/session both green"

              # REAL /v1/turn — the only check that proves the agent loop serves
              # (the ModuleNotFoundError COPY-gap that 502'd 2026-06-16 was invisible
              # to /health and DELETE /v1/session, which never import the persona stack).
              SMOKE_CH="cd-smoke-${{ github.run_id }}"
              TURN_OK=""
              for attempt in 1 2 3 4 5 6; do
                BODY=$(curl -sS -m 120 -w '\nHTTP_CODE:%{http_code}' -X POST \
                  "https://$FQDN/v1/turn" \
                  -H "Authorization: Bearer $TOKEN" \
                  -H "Content-Type: application/json" \
                  -d "{\"channel_id\":\"$SMOKE_CH\",\"user_id\":\"cd-smoke\",\"user_text\":\"ping\"}" 2>&1 \
                  || echo "HTTP_CODE:000")
                CODE=$(echo "$BODY" | grep -o 'HTTP_CODE:[0-9]*' | cut -d: -f2)
                echo "turn attempt $attempt -> HTTP $CODE"
                if echo "$BODY" | grep -qiE "ModuleNotFoundError|No module named"; then
                  echo "FAIL insult-runner: agent loop ModuleNotFoundError — broken image deploy"
                  echo "$BODY" | head -5
                  curl -sS -m 15 -X DELETE "https://$FQDN/v1/session/$SMOKE_CH" \
                    -H "Authorization: Bearer $TOKEN" >/dev/null 2>&1 || true
                  exit 1
                fi
                if [ "$CODE" = "200" ] && echo "$BODY" | grep -q '"text"'; then
                  TURN_OK=1; break
                fi
                sleep 15
              done
              curl -sS -m 15 -X DELETE "https://$FQDN/v1/session/$SMOKE_CH" \
                -H "Authorization: Bearer $TOKEN" >/dev/null 2>&1 || true
              if [ -z "$TURN_OK" ]; then
                echo "FAIL insult-runner: /v1/turn never returned a healthy 200 (agent loop down)"
                exit 1
              fi
              echo "OK insult-runner: real /v1/turn served — agent loop alive"
            else
              echo "WARN insult-runner: token unavailable, skipping DELETE + turn checks"
            fi
          else
            echo "INFO insult-runner: not yet provisioned, skipping health check"
          fi

      - name: Nothing-to-deploy notice
        if: ${{ steps.detect.outputs.build_bot != 'true' && steps.detect.outputs.build_alice != 'true' && steps.detect.outputs.build_gw != 'true' && steps.detect.outputs.build_runner != 'true' }}
        run: echo "No surface changed since its running SHA — nothing built or deployed."
