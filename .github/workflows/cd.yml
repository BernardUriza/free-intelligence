name: CD

# Builds and deploys three Azure Container Apps:
#   * insult-bot      — Discord plumbing / gateway (logical role: discord-bot).
#                       Routes Discord events to the right runner per turn;
#                       does no LLM work itself once LEGACY_LLM_ENABLED=false.
#   * insult-runner   — Claude Code Agent SDK runner (Insult persona).
#                       FastAPI + claude-agent-sdk + OAuth Max.
#   * alice-bot       — ALICE persona runner (Azure OpenAI gpt-4.1).
#                       Passive: only fires on mention or /invite from Insult.
# The physical name `insult-bot` for the plumbing container is legacy
# (predates the runner split). Rename to `discord-bot` is task RENAME-1b.
# See .claude/rules/architecture.md § Nomenclature.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    name: Build & Deploy to Azure
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build insult-bot image
        run: |
          az acr build \
            --registry insultacr \
            --resource-group insult-rg \
            --image insult-bot:${{ github.sha }} \
            --image insult-bot:latest \
            .

      - name: Build alice-bot image
        # ALICE is a sibling Discord bot (alice/ subpackage). Until this step
        # was added in v3.9.18 her image only got rebuilt by manual
        # `az acr build alice-bot:vX.Y.Z` from Bernard's laptop, which meant
        # every alice/ change required a separate push-then-rebuild ritual.
        # Now she ships with the same SHA as Insult.
        run: |
          az acr build \
            --registry insultacr \
            --resource-group insult-rg \
            --image alice-bot:${{ github.sha }} \
            --image alice-bot:latest \
            --file Dockerfile.alice \
            .

      - name: Build insult-runner image
        # The Agent SDK runner. Lives in its own Container App `insult-runner`
        # inside `insult-env`. Reads the workspace mount populated by the
        # renderer (Postgres -> markdown) and exposes a FastAPI service that
        # Insult calls behind a per-user feature flag (see Fase 2 of the
        # Agent SDK migration plan).
        run: |
          az acr build \
            --registry insultacr \
            --resource-group insult-rg \
            --image insult-runner:${{ github.sha }} \
            --image insult-runner:latest \
            --file infra/azure/runner.Dockerfile \
            .

      - name: Deploy insult-bot
        run: |
          az containerapp update \
            --name insult-bot \
            --resource-group insult-rg \
            --image insultacr.azurecr.io/insult-bot:${{ github.sha }}

      - name: Deploy alice-bot
        run: |
          az containerapp update \
            --name alice-bot \
            --resource-group insult-rg \
            --image insultacr.azurecr.io/alice-bot:${{ github.sha }}

      - name: Deploy insult-runner
        # New revision picks up the latest workspace-files mount + secrets.
        # Continue-on-error in case the runner app doesn't exist yet on the
        # first run that contains this step — the workflow shouldn't break
        # Insult deploys just because the runner isn't set up yet.
        continue-on-error: true
        run: |
          az containerapp update \
            --name insult-runner \
            --resource-group insult-rg \
            --image insultacr.azurecr.io/insult-runner:${{ github.sha }}

      - name: Update consolidator job image
        # The fact-consolidation Container App Job runs from the SAME image
        # as the bot but on a separate cron. Without this step the job stays
        # pinned to whatever SHA was last manually pushed, and any feature
        # that touches the consolidator (siesta marks, prompt changes,
        # schema migrations) silently lags behind the bot.
        run: |
          az containerapp job update \
            --name fact-consolidation \
            --resource-group insult-rg \
            --image insultacr.azurecr.io/insult-bot:${{ github.sha }}

      - name: Verify deployment health
        run: |
          echo "Waiting 30s for new revisions to start..."
          sleep 30

          # --- Insult ---
          echo ""
          echo "=== insult-bot ==="
          az containerapp show -n insult-bot -g insult-rg --query "properties.latestRevisionName" -o tsv
          INSULT_LOGS=$(az containerapp logs show -n insult-bot -g insult-rg --tail 30 2>&1 || true)
          echo "$INSULT_LOGS" | tail -10
          if echo "$INSULT_LOGS" | grep -q "bot_ready"; then
            echo "OK insult-bot: bot_ready event present"
          elif echo "$INSULT_LOGS" | grep -q "critical\|CRITICAL\|Traceback"; then
            echo "FAIL insult-bot: crash detected on startup"
            echo "$INSULT_LOGS" | grep -E "critical|CRITICAL|Traceback|Error" || true
            exit 1
          else
            echo "WARN insult-bot: could not confirm bot_ready, check manually"
          fi

          # --- ALICE ---
          echo ""
          echo "=== alice-bot ==="
          az containerapp show -n alice-bot -g insult-rg --query "properties.latestRevisionName" -o tsv
          ALICE_LOGS=$(az containerapp logs show -n alice-bot -g insult-rg --tail 30 2>&1 || true)
          echo "$ALICE_LOGS" | tail -10
          if echo "$ALICE_LOGS" | grep -q "alice_gateway_ready"; then
            echo "OK alice-bot: gateway_ready event present"
          elif echo "$ALICE_LOGS" | grep -q "critical\|CRITICAL\|Traceback"; then
            echo "FAIL alice-bot: crash detected on startup"
            exit 1
          else
            echo "WARN alice-bot: could not confirm gateway_ready, check manually"
          fi

          # --- Runner (best-effort, doesn't fail the deploy yet) ---
          echo ""
          echo "=== insult-runner ==="
          if az containerapp show -n insult-runner -g insult-rg --query "name" -o tsv 2>/dev/null; then
            az containerapp show -n insult-runner -g insult-rg --query "properties.latestRevisionName" -o tsv
            RUNNER_LOGS=$(az containerapp logs show -n insult-runner -g insult-rg --tail 15 2>&1 || true)
            echo "$RUNNER_LOGS" | tail -10
          else
            echo "INFO insult-runner: not yet provisioned, skipping health check"
          fi
