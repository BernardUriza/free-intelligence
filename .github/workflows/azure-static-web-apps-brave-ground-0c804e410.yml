name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
    # The SWA deploys ONLY /dashboard (app_location), so it must fire ONLY when
    # the dashboard source (or this workflow) changes — path-scoped triggers per
    # the fi-runner-azure-deploy doctrine. Before this, EVERY push (incl. docs-only
    # and backend-only commits) redeployed the dashboard for no reason; the CI
    # workflow's .claude/** paths-ignore didn't cover this separate workflow.
    paths:
      - 'dashboard/**'
      - '.github/workflows/azure-static-web-apps-brave-ground-0c804e410.yml'
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main
    paths:
      - 'dashboard/**'
      - '.github/workflows/azure-static-web-apps-brave-ground-0c804e410.yml'

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
          lfs: false
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_BRAVE_GROUND_0C804E410 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "/dashboard" # App source code path
          api_location: "" # Api source code path - optional
          output_location: "" # Built app content directory - optional
          ###### End of Repository/Build Configurations ######

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_BRAVE_GROUND_0C804E410 }}
          action: "close"
