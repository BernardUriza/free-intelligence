# fi-core's own suite, on every PR that touches it.
#
# It had none. Across the whole repo `pytest` was invoked in exactly ONE place —
# pr-gate.yml's "Backend: Tests" — and that job runs `backend/tests/unit`, a
# different tree entirely. So fi-core's 337 tests, fi-runner's, and og118's had
# never run in CI: a PR touching any of them got a green "Backend: Tests" that
# had not executed a line of the code it was gating.
#
# That is the check-that-cannot-fail in its purest form, and it is why this
# library could ship a rule enforced on two write paths out of three. It lives in
# its own file rather than as a job inside pr-gate.yml because the repo already
# organises one workflow per unit (og118-backend, fenix-backend, publish-fi-core)
# — and because pr-gate.yml has another session's uncommitted work in it.
#
# It is safe to make REQUIRED, and that took one design decision. A required
# check whose workflow is path-filtered never reports on a PR that misses the
# filter, so GitHub leaves it "Expected — waiting for status" forever and blocks
# every unrelated PR in the repo. So the job ALWAYS runs; it decides for itself
# whether fi-core changed, and reports success in seconds when it did not. The
# expensive half (a torch-sized install) is what gets skipped, never the report.
name: fi-core tests

on:
  # No `paths:` on pull_request, deliberately — see the note above. The job
  # decides whether there is anything to test; the filter would decide whether
  # there is anything to REPORT, which is not the same thing.
  pull_request:
  push:
    branches: [main]
    paths:
      - 'apps/packages/fi-core/**'
  workflow_dispatch:

concurrency:
  group: fi-core-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: "fi-core: tests"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/packages/fi-core
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the diff below needs the base commit

      - name: Does this PR touch fi-core?
        id: touched
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "yes=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          base="origin/${{ github.base_ref }}"
          git fetch --quiet origin "${{ github.base_ref }}"
          if git diff --name-only "$base"...HEAD | grep -qE '^(apps/packages/fi-core/|\.github/workflows/fi-core-tests\.yml)'; then
            echo "yes=true" >> "$GITHUB_OUTPUT"
          else
            echo "yes=false" >> "$GITHUB_OUTPUT"
            echo "fi-core untouched — nothing to test." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/setup-python@v6
        if: steps.touched.outputs.yes == 'true' 
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/packages/fi-core/pyproject.toml

      - name: Install a Postgres SERVER with pgvector, so the store tests RUN
        if: steps.touched.outputs.yes == 'true'
        run: |
          set -euo pipefail
          # 34 tests SKIP on any host without a matching Postgres + pgvector
          # pair, and among them are the ones covering `save_facts` — the method
          # that was hard-deleting curated facts and wiping a principal's memory
          # on an empty snapshot. Skipping is honest, but a green suite that
          # skipped the riskiest code in the package is a green nobody should
          # bank on. The runner ships the server; only the extension is missing.
          sudo apt-get update -qq
          major=$(ls -d /usr/lib/postgresql/* | sed 's#.*/##' | sort -rn | head -1)
          sudo apt-get install -y -qq "postgresql-${major}-pgvector"
          ls "/usr/lib/postgresql/${major}/bin/pg_ctl"
          find /usr/share/postgresql -name vector.control -print -quit

      - name: Install fi-core with the extras its tests exercise
        if: steps.touched.outputs.yes == 'true'
        run: |
          python -m pip install --upgrade pip
          # The FULL dev extra, torch and all. A leaner install would make the
          # embedder tests `importorskip` themselves away, which is this job
          # reporting green over coverage it silently declined to run — the same
          # defect it exists to fix. No `||` fallback for the same reason: a
          # fallback that installs less turns a broken install into a pass.
          pip install -e '.[dev]' 

      - name: Run the suite
        if: steps.touched.outputs.yes == 'true'
        run: |
          # No `|| true` and no `-exec`: this job's exit status IS pytest's, or
          # it is another green light that proves nothing.
          pytest tests -q

      - name: The pgvector tests must RUN here, not skip
        if: steps.touched.outputs.yes == 'true'
        run: |
          set -euo pipefail
          # Installing the extension and then letting the probe skip anyway would
          # look identical to success in the step above. If these ever go back to
          # skipping, CI says so instead of quietly returning to zero coverage on
          # the store that was destroying data.
          pytest tests/test_stores_pgvector.py tests/test_memory_pgvector_store.py \
            -q -rs --no-header | tee /tmp/pg.txt
          if grep -qi 'skip' /tmp/pg.txt; then
            echo "::error::the pgvector suites SKIPPED on a runner with Postgres + pgvector installed — the probe is not finding them"
            exit 1
          fi

      - name: Report what the host could not run
        if: always() && steps.touched.outputs.yes == 'true'
        run: |
          # A skip is honest, but a suite that skips a whole subsystem should say
          # so out loud rather than let "all green" imply full coverage.
          pytest tests -q -rs 2>&1 | tail -20 >> "$GITHUB_STEP_SUMMARY" || true
